kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: kata-credential-request
  namespace: openshift-sandboxed-containers-operator
subjects:
  - kind: ServiceAccount
    name: default
    namespace: openshift-sandboxed-containers-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: credential-request-admin
